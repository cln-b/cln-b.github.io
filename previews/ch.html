<!DOCTYPE html>
<html lang="en">
<head>
<title>Live previews - 3+ CH</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0a;
    font-family: "Google Sans Code", "Courier New", monospace;
    padding: 20px;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 4px;
  }

  .thumb {
    position: relative;
    aspect-ratio: 16/9;
    background: #111;
    overflow: hidden;
  }

  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: opacity 0.3s;
  }

  .thumb img.loading {
    opacity: 0.4;
  }

  .thumb span {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 7px 8px;
    background: linear-gradient(transparent, rgba(0,0,0,0.2) 45%, rgba(0,0,0,0.65));
    color: #fff;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .thumb::after {
    content: "";
    position: absolute;
    inset: 0;
    border: 1px solid rgba(255,255,255,0.05);
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="grid"></div>
<script>
const channels = [
  { cid: "SV09010", title: "3+" },
  { cid: "SV09056", title: "3+ Movies (4+)" },
  { cid: "SV09256", title: "3+ Adrenalin (TV24)" },
  { cid: "SV09201", title: "3+ Focus (S1)" },
  { cid: "SV09250", title: "3+ Series (5+)" },
  { cid: "SV09255", title: "3+ Emotion (TV25)" },
  { cid: "SV09251", title: "3+ Crime (6+)" },
  { cid: "SV06312", title: "3+ Family (7+)" },
  { cid: "SV09073", title: "3+ Family (7+ Nick)" },
];

const INTERVAL = 20000;
const grid = document.getElementById("grid");

for (const { cid, title } of channels) {
  const wrap = document.createElement("div");
  wrap.className = "thumb";

  const img = document.createElement("img");
  img.alt = title;

  const cap = document.createElement("span");
  cap.textContent = title;

  wrap.append(img, cap);
  grid.appendChild(wrap);

  const tick = () => {
    img.classList.add("loading");
    const next = new Image();
    next.src = `https://staticqbr-prod-ch.gnp.cloud.sunrisetv.ch/image-service/latest/${cid}?w=800&t=${Date.now()}`;
    next.onload = () => { img.src = next.src; img.classList.remove("loading"); };
    next.onerror = () => img.classList.remove("loading");
    setTimeout(tick, INTERVAL);
  };
  tick();
}
</script>
</body>
</html>
